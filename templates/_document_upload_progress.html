<div class="documents-upload-progress" data-upload-progress role="status" aria-live="polite">
  <div class="documents-upload-progress-head">
    <div>
      <div class="documents-upload-progress-title">Avancement du dépôt</div>
      <div class="documents-upload-progress-text" data-progress-text>0/{{ document_count }} documents déposés. {{ document_count }} restants à déposer.</div>
    </div>
    <div class="documents-upload-progress-badge" data-progress-percent>0%</div>
  </div>
  <div class="documents-upload-progress-track" aria-hidden="true"><div class="documents-upload-progress-fill" data-progress-fill></div></div>
</div>
